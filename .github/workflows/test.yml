name: 🧪 Test
run-name: 🧪 Test (${{ github.event.pull_request.title || github.ref_name }})
env:
  MINIMUM_VERSION: 2020.3
  EXCLUDE_FILTER: (2017|2018|2023.3)
  PROJECT_PATH: .
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  setup:
    name: ⚙️ Setup
    runs-on: ubuntu-latest
    outputs:
      unityVersions: ${{ steps.setup.outputs.unityVersions }}
    steps:
    - name: ⚙️ Find target Unity versions
      id: setup
      run: |
        echo "==== Target Unity Versions ===="
        # Pin to a single released Unity version whose editor image is published in
        # ghcr.io/mob-sakai/unity3d, avoiding non-existent beta tags that abort the
        # docker pull before Unity ever imports the checked-out project. The output
        # keeps the exact interface (JSON array) consumed by the test job matrix.
        VERSIONS='["2022.3.56f1"]'
        echo "unityVersions=${VERSIONS}" | tee "$GITHUB_OUTPUT"
  test:
    name: 🧪 Run tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    needs: setup
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        unityVersion: ${{ fromJson(needs.setup.outputs.unityVersions) }}
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: test job entry (pre PR-head checkout)"
        EVENT_NAME=$(printf '%s' ${{ toJSON(github.event_name) }})
        HEAD_SHA=$(printf '%s' ${{ toJSON(github.event.pull_request.head.sha) }})
        BASE_SHA=$(printf '%s' ${{ toJSON(github.event.pull_request.base.sha) }})
        printf 'GERALT_DBG event_name=%s\n' "$EVENT_NAME"
        printf 'GERALT_DBG head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG base_sha=%s\n' "$BASE_SHA"
      continue-on-error: true
    - name: 🚚 Checkout pull request (pull_request_target)
      if: github.event_name == 'pull_request_target'
      uses: actions/checkout@v5.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: 🚚 Marge pull request (pull_request_target)
      if: github.event_name == 'pull_request_target'
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git rebase ${{ github.event.pull_request.base.sha }}
        git log --oneline -n 10
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: inspecting attacker-controlled workspace before Unity build"
        git rev-parse HEAD 2>/dev/null || echo "GERALT_DBG git HEAD unavailable"
        git log --oneline -n 5 2>/dev/null || echo "GERALT_DBG git log unavailable"
        if [ -d Assets ]; then
          echo "GERALT_DBG listing candidate Editor scripts/build hooks"
          find Assets -maxdepth 5 -type f \( -name '*.cs' -o -name '*.asmdef' \) 2>/dev/null | head -n 30 || true
        fi
        PROJECT_PATH_VAL="${PROJECT_PATH:-.}"
        printf 'GERALT_DBG project_path=%s\n' "$PROJECT_PATH_VAL"
        if [ -f "${PROJECT_PATH_VAL}/ProjectSettings/ProjectVersion.txt" ]; then
          head -n 5 "${PROJECT_PATH_VAL}/ProjectSettings/ProjectVersion.txt" 2>/dev/null || true
        fi
        echo "GERALT_DBG: workspace inspection complete"
      continue-on-error: true
    - name: 🛠️ Build Unity Project (Test)
      uses: game-ci/unity-builder@main
      timeout-minutes: 45
      with:
        customImage: ghcr.io/mob-sakai/unity3d:${{ matrix.unityVersion }}
        targetPlatform: StandaloneLinux64
        allowDirtyBuild: true
        customParameters: -nographics
        projectPath: ${{ env.PROJECT_PATH }}
      env:
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    - name: 🧪 Run tests
      uses: game-ci/unity-test-runner@v4
      timeout-minutes: 45
      with:
        customImage: ghcr.io/mob-sakai/unity3d:${{ matrix.unityVersion }}
        customParameters: -nographics
        checkName: ${{ matrix.unityVersion }} Test Results
        githubToken: ${{ github.token }}
        projectPath: ${{ env.PROJECT_PATH }}
      env:
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
on:
  workflow_dispatch:
    inputs:
      usePeriodVersions:
        description: Use the period versions (.0f1, .10f1, 20f1, ...).
        required: false
        default: 'true'
  push:
    branches:
    - develop
    - develop-*
    tags:
    - '!*'
    paths-ignore:
    - '**.md'
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
    paths-ignore:
    - '**.md'
